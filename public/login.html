<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Oferta Fit BR</title>
  <link rel="icon" type="image/png" href="assets/logo-favicon.png" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/membros.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="logo" src="assets/logo.jpg" onerror="this.onerror=null;this.src='assets/logo.svg'" alt="Oferta Fit BR" />

      <div id="erro-login" class="erro-box oculto"></div>
      <div id="aviso-login" class="aviso-box oculto"></div>

      <!-- ===== Login ===== -->
      <form id="form-entrar">
        <h2 style="font-size:1.3rem;text-align:center;margin-bottom:18px">Entrar na área de membros</h2>
        <div class="campo">
          <label for="email-entrar">E-mail</label>
          <input id="email-entrar" type="email" placeholder="voce@email.com" autocomplete="email" required />
        </div>
        <div class="campo">
          <label for="senha-entrar">Senha</label>
          <input id="senha-entrar" type="password" placeholder="Sua senha" autocomplete="current-password" required />
        </div>
        <button class="btn btn--azul btn--bloco" type="submit">Entrar</button>
        <button type="button" id="btn-esqueci" class="btn-esqueci">Esqueci minha senha</button>
      </form>

      <!-- ===== Definir senha (link do e-mail de compra) ===== -->
      <form id="form-definir" class="oculto">
        <h2 style="font-size:1.3rem;text-align:center;margin-bottom:6px">Defina sua senha de acesso</h2>
        <p class="cinza pequeno mb-2 texto-centro">Sua conta já foi criada após o pagamento. É só escolher uma senha.</p>
        <div class="campo">
          <label for="senha-definir">Senha (mín. 6 caracteres)</label>
          <input id="senha-definir" type="password" placeholder="Crie uma senha" required minlength="6" />
        </div>
        <div class="campo">
          <label for="senha-definir2">Repita a senha</label>
          <input id="senha-definir2" type="password" placeholder="Repita a senha" required minlength="6" />
        </div>
        <button class="btn btn--azul btn--bloco" type="submit">Salvar e entrar</button>
      </form>

      <p class="pequeno cinza texto-centro mt-3">
        <strong>Primeiro acesso?</strong> O link para definir sua senha chega no e-mail da compra.<br />
        Ainda não comprou? <a href="index.html" style="color:var(--azul);font-weight:700">Conheça a oferta</a>
      </p>
    </div>
  </div>

  <script src="js/track.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const erro = (m) => { const b = $('#erro-login'); b.textContent = m; b.classList.remove('oculto'); $('#aviso-login').classList.add('oculto'); };
    const aviso = (m) => { const b = $('#aviso-login'); b.innerHTML = m; b.classList.remove('oculto'); $('#erro-login').classList.add('oculto'); };
    const irMembros = () => (location.href = 'membros.html');

    const post = async (url, body) => {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return { ok: r.ok, ...(await r.json().catch(() => ({}))) };
    };

    $('#form-entrar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await post('/api/membros/login', { email: $('#email-entrar').value, senha: $('#senha-entrar').value });
      r.ok ? irMembros() : erro(r.error || 'Não foi possível entrar');
    });

    // Esqueci minha senha — envia link de redefinição por e-mail
    $('#btn-esqueci').addEventListener('click', async () => {
      const email = $('#email-entrar').value.trim();
      if (!email.includes('@')) return erro('Informe seu e-mail no campo acima para receber o link.');
      const r = await post('/api/membros/recuperar-senha', { email });
      aviso('✅ ' + (r.mensagem || 'Se este e-mail tiver uma conta, enviamos o link de redefinição.'));
    });

    // Modo "definir senha" vindo do e-mail (pós-compra ou redefinição)
    const tokenDefinir = new URLSearchParams(location.search).get('definir');
    if (tokenDefinir) {
      $('#form-entrar').classList.add('oculto');
      $('#form-definir').classList.remove('oculto');
      $('#form-definir').addEventListener('submit', async (e) => {
        e.preventDefault();
        const s1 = $('#senha-definir').value, s2 = $('#senha-definir2').value;
        if (s1 !== s2) return erro('As senhas não coincidem');
        const r = await post('/api/membros/definir-senha', { token: tokenDefinir, senha: s1 });
        r.ok ? irMembros() : erro(r.error || 'Link inválido ou expirado — peça um novo em "Esqueci minha senha"');
      });
    }
  </script>
</body>
</html>
