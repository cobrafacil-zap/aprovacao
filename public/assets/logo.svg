<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F52E8"/><stop offset="1" stop-color="#1B2F9E"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F52E8"/><stop offset="1" stop-color="#16266E"/>
    </linearGradient>
  </defs>
  <!-- fundo amarelo arredondado -->
  <rect x="4" y="4" width="212" height="212" rx="48" fill="url(#bg)" stroke="#E8A400" stroke-width="4"/>
  <!-- badge azul -->
  <rect x="20" y="20" width="180" height="150" rx="38" fill="url(#badge)"/>
  <!-- figura masculina (flexão de bíceps) -->
  <g fill="#FFD23F">
    <circle cx="76" cy="58" r="15"/>
    <rect x="63" y="76" width="26" height="44" rx="12"/>
    <rect x="88" y="80" width="30" height="13" rx="6.5" transform="rotate(-22 88 80)"/>
    <rect x="55" y="82" width="26" height="13" rx="6.5" transform="rotate(18 55 82)"/>
  </g>
  <!-- figura feminina (halteres) -->
  <g fill="#FFFFFF">
    <circle cx="146" cy="60" r="14"/>
    <rect x="134" y="77" width="24" height="43" rx="11"/>
    <rect x="112" y="86" width="26" height="11" rx="5.5"/>
    <rect x="154" y="86" width="26" height="11" rx="5.5"/>
    <rect x="106" y="82" width="8" height="19" rx="4"/>
    <rect x="178" y="82" width="8" height="19" rx="4"/>
  </g>
  <!-- bicicleta -->
  <g stroke="#FFD23F" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="86" cy="146" r="15"/>
    <circle cx="138" cy="146" r="15"/>
    <path d="M86 146 L104 122 L128 122 L138 146 M104 122 L112 146 M128 122 L122 112"/>
  </g>
  <!-- faixa com o nome -->
  <rect x="26" y="168" width="168" height="42" rx="14" fill="#FFFFFF" stroke="#E8A400" stroke-width="3"/>
  <text x="110" y="197" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="800" font-style="italic" font-size="27">
    <tspan fill="url(#txt)">OfertaFit</tspan><tspan fill="#FF4B2E">BR</tspan>
  </text>
</svg>
