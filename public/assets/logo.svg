<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD23F"/><stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3054E8"/><stop offset="1" stop-color="#1B2F9E"/>
    </linearGradient>
  </defs>

  <!-- fundo amarelo -->
  <rect x="2" y="2" width="216" height="216" rx="46" fill="url(#bg)" stroke="#E8A400" stroke-width="4"/>

  <!-- badge azul circular com anel dourado -->
  <circle cx="110" cy="94" r="82" fill="url(#badge)" stroke="#FFD23F" stroke-width="9"/>

  <!-- figura masculina (flexão de bíceps, regata) -->
  <g>
    <circle cx="82" cy="58" r="14" fill="#F6C08A"/>
    <rect x="70" y="72" width="24" height="40" rx="11" fill="#3054E8"/>
    <rect x="92" y="76" width="28" height="12" rx="6" fill="#F6C08A" transform="rotate(-24 92 76)"/>
    <rect x="58" y="78" width="26" height="12" rx="6" fill="#F6C08A" transform="rotate(16 58 78)"/>
  </g>

  <!-- figura feminina (halteres, cabelo ruivo) -->
  <g>
    <circle cx="142" cy="60" r="13" fill="#F6C08A"/>
    <path d="M129 58 q3 -18 15 -18 q13 0 14 18 q-6 -8 -15 -8 q-9 0 -14 8z" fill="#E2603A"/>
    <rect x="131" y="73" width="23" height="39" rx="10" fill="#FFFFFF"/>
    <rect x="112" y="82" width="24" height="10" rx="5" fill="#F6C08A"/>
    <rect x="150" y="82" width="24" height="10" rx="5" fill="#F6C08A"/>
    <rect x="106" y="78" width="7" height="18" rx="3.5" fill="#FFD23F"/>
    <rect x="174" y="78" width="7" height="18" rx="3.5" fill="#FFD23F"/>
    <rect x="134" y="112" width="7" height="16" rx="3.5" fill="#FFFFFF"/>
    <rect x="145" y="112" width="7" height="16" rx="3.5" fill="#FFFFFF"/>
  </g>

  <!-- bicicleta -->
  <g stroke="#FFD23F" stroke-width="5.5" fill="none" stroke-linecap="round">
    <circle cx="86" cy="146" r="13"/>
    <circle cx="136" cy="146" r="13"/>
    <path d="M86 146 L103 124 L126 124 L136 146 M103 124 L110 146 M126 124 L121 114"/>
  </g>

  <!-- wordmark: OfertaFit (azul, contorno branco) + BR (vermelho) -->
  <text x="110" y="200" text-anchor="middle" font-family="Poppins, Arial Black, sans-serif" font-weight="800" font-style="italic" font-size="30"
        stroke="#FFFFFF" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
    <tspan fill="#2F52E8">OfertaFit</tspan><tspan fill="#FF4B2E">BR</tspan>
  </text>
</svg>
